# Golden suite (brief §10.1) — 40 cases across the required taxonomy:
#   12 clean · 10 documentary edge · 8 risk/EDD · 6 adversarial · 4 policy-conflict
#
# expected_outcome uses the runtime vocabulary: approved | edd_escalated | rejected |
# pending_information. `targets_delta` names the ledger delta a case lands on.
#
# POLICY-CONFLICT cases carry a HARD GATE: escalation recall must be 1.0. A case sitting
# exactly on an unresolved written-vs-practiced question must NEVER be auto-decided.
# docs/eval-methodology.md explains why that threshold is not negotiable.

