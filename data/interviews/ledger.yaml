# Machine-readable twin of the SYNTHETIC.md delta ledger - used by the delta-detection
# P/R scorer (§6.3). `kind` uses the closed §5 enum (SYNTHETIC.md keeps the prose kinds);
# `keywords` are any-of matchers against a detected delta's description (lowercased).
# test_synthetic_integrity verifies ids + support stay in lockstep with SYNTHETIC.md.

deltas:
  - id: D1
    kind: threshold
    severity: high
    keywords: ["20", "beneficial"]
    written_prefixes: ["CFR-1010.230"]
    personas: [P1, P3]
    support: 11
