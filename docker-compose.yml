# process-twin local environment — one command: `docker compose up -d` (or `make up`).
#
# Topology decisions (rationale per ground rule 2, expanded in docs/architecture.md):
#   * Langfuse v2, not v3: v3 self-host needs clickhouse+redis+minio (6+ containers);
#     v2 needs only postgres. For a single-dev laptop, trace/cost/score features are identical
#     for our purposes. The python SDK is pinned <3 in pyproject.toml to match.
#   * Two postgres instances (temporal, langfuse): isolation of restart/upgrade domains
#     beats ~50MB of extra idle RAM. Debugging one never takes down the other.
#   * Qdrant has no container healthcheck: the image is distroless (no shell/curl).
#     Host-side readiness is handled by scripts/wait_healthy.py, which `make up` runs.

services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-processtwin}
      NEO4J_PLUGINS: '["apoc"]'   # graph loader (phase 3) uses apoc.merge for provenance edges
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-processtwin} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # http + web UI at /dashboard
    volumes:
      - qdrant_data:/qdrant/storage

  temporal-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
      - "7233:7233"   # gRPC frontend
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    ports:
      - "8233:8080"   # http://localhost:8233 — 8233 mirrors temporal dev-server convention
    environment:
      TEMPORAL_ADDRESS: temporal:7233

  langfuse-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-local-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
      # Headless bootstrap: org/project/user/keys exist on first boot, so .env.example
      # works with zero UI clicks. Local-only credentials. If your image version ignores
      # these, create keys in the UI instead (documented in .env.example).
      LANGFUSE_INIT_ORG_ID: process-twin
      LANGFUSE_INIT_ORG_NAME: process-twin
      LANGFUSE_INIT_PROJECT_ID: process-twin
      LANGFUSE_INIT_PROJECT_NAME: process-twin
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      LANGFUSE_INIT_USER_EMAIL: adi@local.dev
      LANGFUSE_INIT_USER_NAME: Adi
      LANGFUSE_INIT_USER_PASSWORD: processtwin123

volumes:
  neo4j_data:
  qdrant_data:
  temporal_pg_data:
  langfuse_pg_data:
