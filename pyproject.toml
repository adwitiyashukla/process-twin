[project]
name = "process-twin"
version = "0.1.0"
description = "From written SOP to governed agent workflow: KYC onboarding process twin with tacit-vs-written delta detection, citation guardrails, durable execution, and pre-production evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adwitiya Shukla", email = "shuklaaw@mail.uc.edu" }]

# Every runtime dependency maps to one architectural layer. Nothing here is speculative.
dependencies = [
    "pydantic>=2.7",           # structured LLM output validation + self-correction loops
    "pydantic-settings>=2.2",  # 12-factor config; thresholds live in config, never in code
    "anthropic>=0.40",         # LLM API; model tiering handled in config.py
    "langgraph>=0.2",          # agent runtime: interrupt/resume HITL, conditional edges
    "neo4j>=5.20",             # process twin graph driver
    "qdrant-client>=1.9",      # clause-level retrieval index
    "temporalio>=1.7",         # durable execution: signals, retries, resumability
    "langfuse>=2.50,<3",       # observability. Pinned <3: tracing.py is written against the
                               # v2 SDK, and self-hosted v2 needs only postgres (see docker-compose)
    "fastapi>=0.110",          # approvals inbox + explorer backend
    "uvicorn>=0.29",
    "httpx>=0.27",             # policy fetching with checksums
    "pyyaml>=6.0",             # personas, golden suite, probe definitions
    "pypdf>=4.2",              # FATF PDF parsing
    "beautifulsoup4>=4.12",    # FFIEC manual HTML parsing
]

[project.optional-dependencies]
# Separate extra because fastembed pulls ONNX runtime + ~100MB of model weights on first use.
# CI installs only `dev`; retrieval tests degrade gracefully (see tests/test_retrieval.py).
retrieval = [
    "fastembed>=0.3",  # BGE embeddings + cross-encoder reranker on CPU, no torch, no API cost
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_twin"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
